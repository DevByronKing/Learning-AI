<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Border Gradient -->
    <linearGradient id="neonBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Brain Neon Gradient -->
    <linearGradient id="brainGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Outer Glow -->
    <filter id="outerBorderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Canvas Canvas Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="#080C14" />
  
  <!-- Subtle Internal Radial Ambient Mesh -->
  <radialGradient id="meshGrad" cx="30%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15" />
    <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.08" />
    <stop offset="100%" stop-color="#080C14" stop-opacity="0" />
  </radialGradient>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#meshGrad)" />

  <!-- Glowing Gradient Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#neonBorderGrad)" stroke-width="12" filter="url(#outerBorderGlow)" />

  <!-- Central Symbol: Brain + Neural Circuit Nodes -->
  <g transform="translate(116, 116)" filter="url(#neonGlow)">
    <!-- Circuit Lines & Nodes (Right Side) -->
    <!-- Top Branch -->
    <path d="M140 70 L195 70 A 15 15 0 0 1 210 85 L210 95" fill="none" stroke="url(#brainGlowGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="210" cy="105" r="14" fill="#22D3EE" />

    <!-- Upper Middle Branch -->
    <path d="M140 115 L230 115" fill="none" stroke="url(#brainGlowGrad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="245" cy="115" r="14" fill="#38BDF8" />

    <!-- Center Line -->
    <path d="M140 145 L180 145" fill="none" stroke="url(#brainGlowGrad)" stroke-width="16" stroke-linecap="round" />
    <circle cx="195" cy="145" r="14" fill="#60A5FA" />

    <!-- Lower Middle Branch -->
    <path d="M140 175 L225 175 A 15 15 0 0 1 240 190 L240 200" fill="none" stroke="url(#brainGlowGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="240" cy="215" r="14" fill="#22D3EE" />

    <!-- Brain Left Lobes Outline -->
    <path d="
      M 140 50 
      C 105 50, 75 75, 75 105 
      C 45 110, 35 145, 45 175 
      C 30 200, 50 235, 80 235 
      C 100 245, 125 240, 140 230
      C 145 220, 145 60, 140 50 Z" 
      fill="none" 
      stroke="url(#brainGlowGrad)" 
      stroke-width="16" 
      stroke-linecap="round" 
      stroke-linejoin="round" />
  </g>
</svg>
