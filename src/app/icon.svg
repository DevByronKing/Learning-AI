<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="brainGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="18" fill="#090D16" />
  <rect width="62" height="62" x="1" y="1" rx="17" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" />

  <!-- Outer Glow Halo -->
  <circle cx="32" cy="32" r="18" fill="url(#brainGrad)" opacity="0.2" filter="url(#glow)" />

  <!-- Neural Hemisphere Left -->
  <path d="M30 16C22 16 16 22 16 30C16 34.5 18 38 21 40C20 43 22 47 26 48C28 48 30 46 30 44V16Z" 
        fill="url(#brainGrad)" opacity="0.9" />

  <!-- Neural Hemisphere Right (Golden Core) -->
  <path d="M34 16C42 16 48 22 48 30C48 34.5 46 38 43 40C44 43 42 47 38 48C36 48 34 46 34 44V16Z" 
        fill="url(#goldGrad)" opacity="0.95" />

  <!-- Synaptic Connectors & Network Lines -->
  <line x1="24" y1="24" x2="32" y2="28" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" />
  <line x1="40" y1="24" x2="32" y2="28" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="32" y1="28" x2="32" y2="40" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="36" x2="32" y2="40" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="42" y1="36" x2="32" y2="40" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="round" />

  <!-- Quantum / Neural Nodes -->
  <circle cx="32" cy="28" r="3" fill="#FFFFFF" filter="url(#glow)" />
  <circle cx="32" cy="40" r="2.5" fill="#38BDF8" />
  <circle cx="24" cy="24" r="2" fill="#FDE047" />
  <circle cx="40" cy="24" r="2" fill="#38BDF8" />
  <circle cx="22" cy="36" r="1.8" fill="#60A5FA" />
  <circle cx="42" cy="36" r="1.8" fill="#FBBF24" />

  <!-- Sparkle Accent -->
  <path d="M32 10L33 13L36 14L33 15L32 18L31 15L28 14L31 13Z" fill="#FDE047" />
</svg>